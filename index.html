<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131a">
    <title>Story Track — 視聴記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1016;
            --surface: #151922;
            --surface-2: #1b202b;
            --line: rgba(255, 255, 255, .09);
            --text: #f6f4ef;
            --muted: #9299a8;
            --accent: #ff7657;
            --accent-2: #ffb45f;
            --success: #67d7a2;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 85% -10%, rgba(255, 118, 87, .16), transparent 34rem),
                radial-gradient(circle at -10% 65%, rgba(65, 105, 225, .10), transparent 32rem),
                var(--bg);
            font-family: "Noto Sans JP", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            content: "";
            opacity: .025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        button, input { font: inherit; }

        .app {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 36px 0 80px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 64px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            font-size: .88rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 9px;
            color: #11141b;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            box-shadow: 0 8px 25px rgba(255, 118, 87, .25);
        }

        .type-switch {
            display: flex;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(21, 25, 34, .75);
            backdrop-filter: blur(12px);
        }

        .type-switch input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .type-switch label {
            min-width: 84px;
            padding: 8px 15px;
            border-radius: 8px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: .2s ease;
        }

        .type-switch input:checked + label {
            color: var(--text);
            background: var(--surface-2);
            box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 40px;
            margin-bottom: 42px;
        }

        .kicker {
            margin-bottom: 14px;
            color: var(--accent);
            font-family: "DM Sans", sans-serif;
            font-size: .73rem;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 730px;
            margin: 0 0 18px;
            font-size: clamp(2.3rem, 6vw, 4.7rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -.065em;
        }

        h1 .accent {
            color: transparent;
            background: linear-gradient(100deg, var(--accent-2), var(--accent));
            background-clip: text;
            -webkit-background-clip: text;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.8;
        }

        .add-button {
            display: inline-flex;
            min-height: 54px;
            align-items: center;
            gap: 10px;
            padding: 0 23px;
            border: 0;
            border-radius: 14px;
            color: #13151a;
            background: linear-gradient(110deg, var(--accent-2), var(--accent));
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 14px 35px rgba(255, 118, 87, .24);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(255, 118, 87, .32);
        }

        .add-button:active { transform: translateY(0); }

        .workspace {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(21, 25, 34, .84);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
            backdrop-filter: blur(16px);
        }

        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 25px;
            border-bottom: 1px solid var(--line);
        }

        .workspace-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            font-size: .92rem;
            font-weight: 700;
        }

        .workspace-title i { color: var(--accent); }

        .count {
            padding: 5px 10px;
            border: 1px solid rgba(103, 215, 162, .18);
            border-radius: 999px;
            color: var(--success);
            background: rgba(103, 215, 162, .07);
            font-family: "DM Sans", sans-serif;
            font-size: .7rem;
            font-weight: 700;
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            min-width: 940px;
            border-collapse: collapse;
        }

        th {
            padding: 14px 18px;
            color: #707887;
            background: rgba(255, 255, 255, .018);
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-align: left;
            text-transform: uppercase;
            white-space: nowrap;
        }

        th:first-child, td:first-child { width: 76px; text-align: center; }
        th:nth-child(2) { min-width: 240px; }
        th:nth-child(3), th:nth-child(4) { width: 112px; }
        th:last-child, td:last-child { width: 72px; text-align: center; }

        td {
            padding: 12px 10px;
            border-top: 1px solid var(--line);
        }

        tbody tr { transition: background-color .2s ease; }
        tbody tr:hover { background: rgba(255, 255, 255, .025); }
        tbody tr.is-completed { opacity: .56; }

        .cell-input {
            width: 100%;
            min-height: 42px;
            padding: 0 11px;
            border: 1px solid transparent;
            border-radius: 9px;
            outline: none;
            color: var(--text);
            background: transparent;
            font-size: .82rem;
            transition: .2s ease;
        }

        .cell-input:hover { background: rgba(255, 255, 255, .035); }

        .cell-input:focus {
            border-color: rgba(255, 118, 87, .5);
            background: var(--surface-2);
            box-shadow: 0 0 0 3px rgba(255, 118, 87, .08);
        }

        .cell-input[type="number"] { width: 88px; }
        .cell-input[type="date"] { min-width: 142px; color-scheme: dark; }

        .complete-check {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: var(--success);
            cursor: pointer;
        }

        .delete-button {
            display: inline-grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #6f7683;
            background: transparent;
            cursor: pointer;
            transition: .2s ease;
        }

        .delete-button:hover {
            border-color: rgba(255, 118, 87, .18);
            color: var(--accent);
            background: rgba(255, 118, 87, .08);
        }

        .empty-state td {
            padding: 60px 24px 64px;
            text-align: center;
        }

        .empty-state:hover { background: transparent; }

        .empty-icon {
            display: grid;
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 16px;
            color: var(--accent);
            background: var(--surface-2);
            font-size: 1.2rem;
        }

        .empty-state strong { display: block; margin-bottom: 7px; font-size: .9rem; }
        .empty-state span { color: var(--muted); font-size: .76rem; }

        .hint {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 14px 4px 0;
            color: #626a78;
            font-size: .7rem;
        }

        @media (max-width: 720px) {
            .app { width: calc(100% - 24px); padding-top: 22px; }
            .topbar { align-items: flex-start; flex-direction: column; gap: 22px; margin-bottom: 48px; }
            .type-switch { width: 100%; }
            .type-switch label { flex: 1; }
            .hero { grid-template-columns: 1fr; gap: 28px; }
            h1 { font-size: clamp(2.35rem, 13vw, 3.7rem); }
            .add-button { width: 100%; justify-content: center; }
            .workspace { border-radius: 17px; }
            .workspace-header { padding: 19px 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="topbar" aria-label="メインナビゲーション">
            <div class="brand">
                <span class="brand-mark"><i class="bi bi-book-half" aria-hidden="true"></i></span>
                Story Track
            </div>

            <div class="type-switch" role="group" aria-label="作品タイプ">
                <input type="radio" name="type" id="anime" checked>
                <label for="anime">アニメ</label>
                <input type="radio" name="type" id="manga">
                <label for="manga">マンガ</label>
            </div>
        </nav>

        <section class="hero">
            <div>
                <div class="kicker">Pick up where you left off</div>
                <h1>物語の続きを、<br><span class="accent">見失わない。</span></h1>
                <p class="lead">シーズン、話数、最後に見た日。<br>次に開く場所を、ここに残しておこう。</p>
            </div>
            <button id="addrecordbutton" class="add-button" type="button">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                新しい作品を追加
            </button>
        </section>

        <section class="workspace" aria-labelledby="list-heading">
            <div class="workspace-header">
                <h2 class="workspace-title" id="list-heading">
                    <i class="bi bi-collection-play" aria-hidden="true"></i>
                    マイリスト
                </h2>
                <span class="count" id="record-count" aria-live="polite">0 TITLES</span>
            </div>
            <div class="table-wrap">
                <table id="table">
                    <thead>
                        <tr>
                            <th scope="col">完結</th>
                            <th scope="col">タイトル</th>
                            <th scope="col">シーズン</th>
                            <th scope="col">話数</th>
                            <th scope="col">見始めた日</th>
                            <th scope="col">最近見た日</th>
                            <th scope="col"><span class="visually-hidden">削除</span></th>
                        </tr>
                    </thead>
                    <tbody id="tablebody"></tbody>
                </table>
            </div>
        </section>
        <p class="hint"><i class="bi bi-info-circle" aria-hidden="true"></i> 入力内容はこのブラウザに自動保存されます</p>
    </main>
    <script type="module" src="./dist/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta nema="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">
                        📚 巻・話数を入力しましょう
                    </h2>
                    <p class="text-secondary mb-0">
                        続きを忘れないように記録しておきましょう
                    </p>
                </div>
        
                <div class="btn-group">
                    <input type="radio" class="btn-check" name="type" id="anime" checked>
                    <label class="btn btn-outline-primary" for="anime">
                        アニメ
                    </label>
        
                    <input type="radio" class="btn-check" name="type" id="manga">
                    <label class="btn btn-outline-primary" for="manga">
                        マンガ
                    </label>
                </div>
        
            </div>
        
            <div class="card shadow-sm border-0">
        
                <div class="table-responsive">
        
                    <table class="table table-hover align-middle mb-0">
        
                        <thead class="table-light">
        
                            <tr>
                                <th>タイトル</th>
                                <th>シーズン</th>
                                <th>話数</th>
                                <th>見始めた日</th>
                                <th>最近見た日</th>
                            </tr>
        
                        </thead>
        
                        <tbody>
        
                            <tr>
                                <td>葬送のフリーレン</td>
                                <td>Season1</td>
                                <td>18話</td>
                                <td>2026/07/01</td>
                                <td>2026/07/20</td>
                            </tr>
        
                            <tr>
                                <td>ダンダダン</td>
                                <td>Season1</td>
                                <td>10話</td>
                                <td>2026/07/10</td>
                                <td>2026/07/19</td>
                            </tr>
        
                            <tr>
                                <td>ワンピース</td>
                                <td>Season1</td>
                                <td>1136話</td>
                                <td>2025/11/12</td>
                                <td>2026/07/18</td>
                            </tr>
        
                        </tbody>
        
                    </table>
        
                </div>
        
            </div>    </div>
    </body>
</html>

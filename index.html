<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta nema="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">
                        📚 巻・話数を入力しましょう
                    </h2>
                    <p class="text-secondary mb-0">
                        続きを忘れないように記録しておきましょう
                    </p>
                </div>

                <div class="btn-group">
                    <input type="radio" class="btn-check" name="type" id="anime" checked>
                    <label class="btn btn-outline-primary" for="anime">
                        アニメ
                    </label>
        
                    <input type="radio" class="btn-check" name="type" id="manga">
                    <label class="btn btn-outline-primary" for="manga">
                        マンガ
                    </label>
                </div>
            </div>

            <div>
                <button id="addrowbutton" class="btn btn-primary" type="button">追加</button>
            </div>
                
            <div class="card shadow-sm border-0">
        
                <div class="table-responsive">
        
                    <table class="table table-hover align-middle mb-0" id="table">
                        <thead class="table-light">
                            <tr>
                                <th>完結の有無</th>
                                <th>タイトル</th>
                                <th>シーズン</th>
                                <th>話数</th>
                                <th>見始めた日</th>
                                <th>最近見た日</th>
                            </tr>
                        </thead>
                        <tbody id="tablebody"></tbody>
                    </table>
        
                </div>
        
            </div>    
        </div>
        <script type="module" src="./dist/index.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta nema="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">
                        📚 巻・話数を入力しましょう
                    </h2>
                    <p class="text-secondary mb-0">
                        続きを忘れないように記録しておきましょう
                    </p>
                </div>

                <div class="btn-group">
                    <input type="radio" class="btn-check" name="type" id="anime" checked>
                    <label class="btn btn-outline-primary" for="anime">
                        アニメ
                    </label>
        
                    <input type="radio" class="btn-check" name="type" id="manga">
                    <label class="btn btn-outline-primary" for="manga">
                        マンガ
                    </label>
                </div>
            </div>
            
            <section class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-3">
                        作品を追加
                    </h2>
                    <form id="story-form" class="row g-3">
                        <div class="col-12 col-lg-4">
                            <label for="title" class="form-label">
                                タイトル
                            </label>
                            <input type="text" id="title" class="form-control" placeholder="作品名を入力" required>
                        </div>
                        <div class="col-6 col-md-3 col-lg-2">
                            <label for="season" class="form-label">
                                シーズン
                            </label>
                            <input type="number" id="season" class="form-control" min="1" placeholder="1">
                        </div>
                        <div class="col-6 col-md-3 col-lg-2">
                            <label for="episode" class="form-label">
                                話数
                            </label>
                            <input type="number" id="episode" class="form-control" min="1" placeholder="1" required>
                        </div>
                        <div class="col-12 col-md-6 col-lg-2">
                            <label for="startDate" class="form-label">
                                見始めた日
                            </label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col-12 col-md-6 col-lg-2">
                            <label for="lastDate" class="form-label">
                                最近見た日
                            </label>
                            <input type="date" id="lastDate" class="form-control">
                        </div>
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary px-4">
                                追加
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        
            <div class="card shadow-sm border-0">
        
                <div class="table-responsive">
        
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>タイトル</th>
                                <th>シーズン</th>
                                <th>話数</th>
                                <th>見始めた日</th>
                                <th>最近見た日</th>
                            </tr>
                        </thead>
                    </table>
        
                </div>
        
            </div>    
        </div>
        <script type="module" src="./dist/index.js"></script>
    </body>
</html>
